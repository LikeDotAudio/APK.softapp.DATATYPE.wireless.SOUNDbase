# WIRELESS_SOUNDBASE — the Soundbase CSV report importer as a worker.
# Published to MQTT (retained) by apk-plugin-runner at: APK.audio/System/Protocols/wireless_soundbase/config
[wireless_soundbase]
# How this is raised (contracts/DISCOVERY-LIFECYCLE.md, stage 2): compose = up for as
# long as its stack is up; the discovery engine does not supervise it.
raise = compose
enabled = true
# A job arrives on APK.audio/System/Protocols/wireless_soundbase/outgoing/job (not
# retained) as JSON: {"job_id": "...", "filename": "SB PDF.csv", "text": "..."}
# or with "content_b64" in place of "text". The answer goes to
# APK.audio/System/Protocols/wireless_soundbase/incoming/result (not retained),
# carrying the same job_id.
# A job whose report is larger than this many bytes is answered with an error
# rather than parsed. 8 MiB is far beyond any report seen (the fixture is
# test_data/SB PDF.csv).
max_job_bytes = 8388608
# Every carrier an imported file names is said under
# APK.audio/System/Protocols/wireless_soundbase/Device/<id>/<leaf> (ROAD-3519,
# src/carriers.rs): unkept, again every restate_s seconds, and sighted for
# presence at APK.audio/Discovery/wireless_soundbase/<deviceId>. A file's carriers last
# until the same file is imported again or the worker restarts.
restate_s = 30
# Presence is the runner's: these two keys start its tracker. A carrier not
# restated for this long (a restarted worker forgets its imports) is offline.
presence_protocols = wireless_soundbase
presence_inactive_after_s = 90
